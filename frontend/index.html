<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCRG — Predictive Circular-Resource Grid</title>
  <link rel="stylesheet" href="styles.css?v=20261024_05">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="data.js?v=20261024_05"></script>
</head>
<body>
  <div class="pcrg-shell">
    
    <!-- Top Dark Header Bar -->
    <header class="pcrg-header">
      <div class="header-brand">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div class="brand-title-wrap">
          <span class="brand-pcrg">PCRG</span>
          <span class="brand-full">Predictive Circular-Resource Grid (P2P 2026)</span>
        </div>
      </div>

      <div class="header-right-meta">
        <div class="weather-widget" id="header-weather-widget" title="Live Campus Meteorological Telemetry">
          <span id="weather-icon-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <div>
            <span class="temp tnum" id="weather-temp-val">28.4°C</span>
            <span class="weather-sub-text" id="weather-cond-val">68% RH &bull; 785 W/m²</span>
          </div>
        </div>

        <div class="time-widget" id="header-datetime-readout">
          <span class="live-clock-pulse"></span>
          <span id="live-datetime-text">Initializing clock...</span>
        </div>

        <button class="notif-bell-btn" title="Alert Notifications" onclick="switchNavTab('alerts')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge-pill" id="notif-badge-count">3</span>
        </button>

        <button class="theme-toggle-btn" title="Toggle Sidebar Contrast (Light / Dark)" onclick="toggleSidebarTheme()">
          <span>◐ Sidebar</span>
        </button>

        <div class="user-profile-badge">
          <div class="avatar-circle">A</div>
          <span class="user-name-text">Admin</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <!-- Body Layout: Sidebar + Main Content -->
    <div class="pcrg-body-container">
      
      <!-- Left Dark Sidebar -->
      <aside class="pcrg-sidebar">
        <div class="sidebar-menu-list">
          <a class="menu-item-link active" data-tab="dashboard" onclick="switchNavTab('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Dashboard
          </a>
          <a class="menu-item-link" data-tab="buildings" onclick="switchNavTab('buildings')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="2"/><line x1="8" y1="6" x2="10" y2="6"/><line x1="14" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>
            Buildings
          </a>
          <a class="menu-item-link" data-tab="forecasts" onclick="switchNavTab('forecasts')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            Forecasts
          </a>
          <a class="menu-item-link" data-tab="resources" onclick="switchNavTab('resources')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            Resources
          </a>
          <a class="menu-item-link" data-tab="reports" onclick="switchNavTab('reports')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Reports
          </a>
          <a class="menu-item-link" data-tab="incentives" onclick="switchNavTab('incentives')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Incentives
          </a>
          <a class="menu-item-link" data-tab="alerts" onclick="switchNavTab('alerts')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Alerts
            <span class="menu-badge-red" id="sidebar-alert-badge">3</span>
          </a>
          <a class="menu-item-link" data-tab="settings" onclick="switchNavTab('settings')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
          </a>
        </div>

        <div class="sidebar-bottom-promo">
          <div class="promo-leaf-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/></svg>
          </div>
          <div class="promo-text">
            Greener Campus<br><span style="color:#64748b; font-weight:normal;">Brighter Future</span>
          </div>
        </div>
      </aside>

      <!-- Main Canvas Viewport -->
      <main class="pcrg-main-viewport" id="main-content-viewport">
        <!-- Injected via JavaScript based on active sidebar tab -->
      </main>

    </div>

  </div>

  <script src="app.js?v=20261024_05"></script>
</body>
</html>
